name: Build Discord Pulse
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Build Tools
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          mkdir -p android-sdk/cmdline-tools
          unzip -q tools.zip -d android-sdk/cmdline-tools
          mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
          yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Compile Plugin
        run: |
          mkdir -p build/classes
          javac -cp "android-sdk/platforms/android-34/android.jar" src/*.java -d build/classes/
          android-sdk/build-tools/34.0.0/d8 $(find build/classes -name "*.class") --output ./
          zip discord-pulse.plugin plugin.json classes.dex

      - name: Upload .plugin
        uses: actions/upload-artifact@v4
        with:
          name: discord-pulse.plugin
          path: discord-pulse.plugin
          
