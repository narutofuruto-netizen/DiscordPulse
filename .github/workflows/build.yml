name: Build Discord Pulse
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compile and Package Plugin
        run: |
          mkdir -p build/classes
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -V | tail -n 1)
          D8_TOOL=$(find $ANDROID_HOME/build-tools -name "d8" | sort -V | tail -n 1)

          javac -cp "$ANDROID_JAR" $(find . -name "*.java") -d build/classes/
          $D8_TOOL $(find build/classes -name "*.class") --output ./
          zip -0 discord-pulse.plugin plugin.json classes.dex

      - name: Create Release with Direct File
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: latest
          name: Discord Pulse Latest
          files: discord-pulse.plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
