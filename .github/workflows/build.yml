name: Build Discord Pulse
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compile and Package Plugin
        run: |
          mkdir -p build/classes
          # Используем встроенный Android SDK на GitHub Runner
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -V | tail -n 1)
          D8_TOOL=$(find $ANDROID_HOME/build-tools -name "d8" | sort -V | tail -n 1)

          # Компиляция Java исходников
          javac -cp "$ANDROID_JAR" $(find . -name "*.java") -d build/classes/

          # Сборка classes.dex
          $D8_TOOL $(find build/classes -name "*.class") --output ./

          # Упаковка в готовый плагин
          zip discord-pulse.plugin plugin.json classes.dex

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-pulse.plugin
          path: discord-pulse.plugin
          
